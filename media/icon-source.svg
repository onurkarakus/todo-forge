<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F3B4D"/>
      <stop offset="1" stop-color="#0F1C25"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF6B3D"/>
      <stop offset="0.6" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FFE08A"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- row 1: done -->
  <rect x="44" y="62" width="40" height="40" rx="11" fill="#E6B325"/>
  <path d="M53 82 l8 8 l15 -18" fill="none" stroke="#1A2630" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="100" y="74" width="56" height="16" rx="8" fill="#E8EEF2" opacity="0.92"/>
  <!-- row 2 -->
  <rect x="44" y="118" width="40" height="40" rx="11" fill="none" stroke="#FF6B6B" stroke-width="7"/>
  <rect x="100" y="130" width="104" height="16" rx="8" fill="#E8EEF2" opacity="0.7"/>
  <!-- row 3 -->
  <rect x="44" y="174" width="40" height="40" rx="11" fill="none" stroke="#C792EA" stroke-width="7"/>
  <rect x="100" y="186" width="84" height="16" rx="8" fill="#E8EEF2" opacity="0.5"/>
  <!-- forge spark -->
  <g filter="url(#glow)">
    <path d="M196 30 C 206 50, 222 56, 218 78 C 215 94, 202 102, 190 100 C 176 98, 168 86, 172 72 C 174 64, 180 60, 182 52 C 186 60, 190 62, 192 58 C 194 50, 192 40, 196 30 Z" fill="url(#flame)"/>
  </g>
</svg>
